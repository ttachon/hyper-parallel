# Qwen3.5-35B-A3B-Base 训练配方（文本塔，FSDP + EP）。
#
# 预期资源：多机 Ascend NPU（hccl backend），示例按 64 卡（4 机 x 16 卡）给出。
# 换规模时只需改 accelerator.ep_size 与 fsdp_config 的两个分片宽度，约束是：
#   ep_size 整除 num_experts(256) 且整除 world_size
#   dp_shard_size = world_size            （参数与优化器全分片）
#   edp_shard_size = world_size / ep_size （专家参数在 EP 组之外再分片；默认 1 会让专家优化器状态不分片）
#
# 本配方只训练文本塔：HF 的 AutoModelForCausalLM 会取 text_config 构建
# Qwen3_5MoeForCausalLM，checkpoint 中的 vision 与 MTP 权重被忽略，也不会保存。
#
# 默认加载公开 Hugging Face 资源。本地或离线资源用命令行覆盖，例如：
#   scripts/train_lm.py <this file> \
#     --model.pretrained_model_name_or_path=/path/to/Qwen3.5-35B-A3B-Base \
#     --dataset.model_assets.tokenizer.pretrained_model_name_or_path=/path/to/Qwen3.5-35B-A3B-Base

model:
  _target_: hyper_parallel.models.HyperAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: Qwen/Qwen3.5-35B-A3B-Base
  ignore_mismatched_sizes: true
  torch_dtype: bfloat16
  attn_implementation: sdpa
  # HF 5.14 的默认 experts 实现是 grouped_mm（torch._grouped_mm）。Ascend 上
  # 该算子未必可用，先用 eager 逐专家路径保证可跑；确认可用后可去掉本行。
  experts_implementation: eager

training:
  train_iters: 3
  train_samples: null
  global_batch_size: 128
  micro_batch_size: 1
  backend: hccl
  init_device: meta
  loss_aggregation: token_weighted
  max_grad_norm: 1.0
  seed: 42
  enable_full_determinism: true

accelerator:
  tp_size: 1
  # TP 会在 GDN 的 conv1d 分组卷积上前向报错，Qwen3.5 的 GDN 头数也不会自动整除，
  # 保持 tp_size: 1。
  cp_size: 1
  # CP 需要下方 `when: cp` 的两条 plan_overrides，且 CP 与 TP 不能同时开启。
  ep_size: 8
  pp_size: 1
  # master 的 Trainer 没有 PipelineStage 与调度，pp_size > 1 不报错但也不流水，
  # 每个 stage 组会各自训练一份完整副本，保持 pp_size: 1。
  sequence_parallel: false
  loss_parallel: false

fsdp_config:
  dp_shard_size: 64
  edp_shard_size: 8
  replicate_params: []
  reshard_after_forward: true
  reshard_after_backward: true
  requires_grad_sync: true
  forward_prefetch_depth: 1
  backward_prefetch_depth: 1
  comm_fusion: false

plan_overrides:
  # Qwen3.5-MoE 的 MoE block = routed + sigmoid(shared_expert_gate(x)) * shared_expert(x)，
  # 与 qwen2moe archetype 完全一致。
  # 注意：不要改用 qwen3_moe 的 qwen3moe_ep_compute_fn，它只返回 routed 分支，
  # 会通过接口检查但静默丢掉 shared expert。
  # use_grouped_gemm picks npu_grouped_swiglu over the per-expert loop, whose cost
  # grows as num_experts / ep_size. Set it false to fall back to the loop.
  - match: "*.mlp"
    when: ep
    region_dispatch: false
    local_compute_fn:
      _target_: hyper_parallel.models.qwen3_5_moe.adapter.distributed.expert_parallel.qwen3_5_moe_ep_compute_fn
      use_grouped_gemm: true
  # 开启 CP 时需要下面两条（cp_size > 1 才生效）。GDN 用 p2p 算法对 cp 无整除要求；
  # 当 cp 同时整除 16（k heads）与 32（v heads）时也可换成 qwen3_5_gdn_ulysses_cp_wrapper。
  - match: "*.linear_attn"
    when: cp
    region_dispatch: false
    inner_target: self
    inner_wrapper:
      _target_: hyper_parallel.models.qwen3_5.adapter.distributed.context_parallel.qwen3_5_gdn_p2p_cp_wrapper
  - match: "*.self_attn"
    when: cp
    region_dispatch: false
    inner_target: self
    inner_wrapper:
      _target_: hyper_parallel.distributed.context_parallel.wrappers.sdpa_hf_cp_wrapper

mixed_precision:
  enabled: false

activation_checkpoint:
  mode: full

activation_swap: none

compile:
  enabled: false
  mode: default
  fullgraph: false
  dynamic: false
  backend: null
  options: {}
  dynamo_cache_size_limit: 256

dataset:
  model_assets:
    chat_template: null
    tokenizer:
      _target_: hyper_parallel.data.text.build_tokenizer.AutoTokenizer.from_pretrained
      pretrained_model_name_or_path: Qwen/Qwen3.5-35B-A3B-Base
      use_fast: true
      trust_remote_code: true
  data_transform:
    _target_: hyper_parallel.data.text.build_data_transform.build_llm_data_transform
    data_type: plaintext
    text_keys: text
    max_seq_len: 4096
  data_config:
    dataset_type: mapping
    hf_dataset_name: Salesforce/wikitext
    hf_config_name: wikitext-2-raw-v1
    cache_dir: null
    labels_are_shifted: true
    create_attention_mask_in_dataloader: true
    create_ltor_fields_in_dataloader: false
  _target_: hyper_parallel.data.text.build_dataset.build_online_text_dataset
  data_path: null

dataloader:
  _target_: hyper_parallel.data.batching.DynamicBatchDataLoader
  min_buffered_samples: 200
  collate_fn:
    _target_: hyper_parallel.data.batching.build_online_text_collate_fn
  get_batch:
    _target_: hyper_parallel.data.batching.ParallelBatch
    source_type: online
    attention_mode: dense
  dataloader_type: single
  data_rearrange_map: null
  data_sharding: false
  drop_last: true
  use_background_prefetcher: false
  num_workers: 0
  pin_memory: false
  prefetch_factor: null

optimizer:
  _target_: hyper_parallel.components.optim.Muon
  no_decay_params: [bias, norm, ln_]
  muon_config:
    muon_lr: 3.0e-5
    muon_weight_decay: 0.0
    muon_momentum: 0.95
    muon_nesterov: true
    muon_ns_steps: 5
    muon_ns_variant: asym5
  adamw_config:
    adamw_lr: 1.0e-5
    adamw_weight_decay: 0.01
    adamw_betas: [0.9, 0.999]
    adamw_eps: 1.0e-8

lr_scheduler:
  _target_: hyper_parallel.components.optim.MultiLRScheduler
  lr_decay_style: cosine
  lr_config:
    lr: 3.0e-5
    lr_warmup_steps: 1
    min_lr: 0.0

checkpoint:
  save_ckpt: false
  checkpoint_dir: ./outputs/qwen3_5_moe/checkpoints
  save_steps: 10
  save_epochs: 1
  is_async: false
  save_optimizer: true
  save_train_state: true
  save_extra_state_per_rank: false
  restore_from: null
  restore_optimizer: true
  restore_train_state: true

debug:
  check_nan_inf: false
  check_dataset: null

profiling:
  enabled: false
  start_step: 3
  end_step: 4
  trace_dir: ./outputs/qwen3_5_moe/profiling
  record_shapes: false
  profile_memory: false
  with_stack: false
  with_modules: false
  rank: 0
