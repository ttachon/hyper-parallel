# Qwen: the default decoder.  The family differs only in how it shards
# activations, which is strategy rather than op counts.
kinds:
  decoder:
    ops:
      attMM: 4
      attBMM: 2
      ffMM: 3
      softmax: 1
      dropout: 0
      normOp: 2
      gather: 4
      headCast: 1
      ffAct: 1
      linrec: 0
